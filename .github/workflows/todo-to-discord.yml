name: Sync TODO to Discord

permissions:
  contents: write

on:
  push:
    paths:
      - TODO.md

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read message ID
        id: msg
        run: |
          if [ -f .TODO_message_id ]; then
            echo "ID=$(cat .TODO_message_id)" >> $GITHUB_OUTPUT
          fi

      - name: Create or update Discord message
        run: |
          JSON=$(jq -Rs '{content: .}' TODO.md)

          if [ -n "${{ steps.msg.outputs.ID }}" ]; then
            echo "Editing existing message"
            curl -X PATCH \
              "${{ secrets.TODO_WEBHOOK }}/messages/${{ steps.msg.outputs.ID }}" \
              -H "Content-Type: application/json" \
              -d "$JSON"
          else
            echo "Creating message"
            RESPONSE=$(curl -s -X POST "${{ secrets.TODO_WEBHOOK }}?wait=true" \
              -H "Content-Type: application/json" \
              -d "$JSON")

            echo "$RESPONSE" | jq -r '.id' > .TODO_message_id
          fi

      - name: Commit message ID (first run only)
        if: steps.msg.outputs.ID == ''
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .TODO_message_id
          git commit -m "Track TODO Discord message"
          git push
